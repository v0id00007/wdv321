<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael's Portfolio - JavaScript Homework">
    <title>wdv321 Homework</title>
    <link rel="stylesheet" type="text/css" href="/flexbox.css">
   <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #000; /* Black text throughout */
            /*background: linear-gradient(to bottom, #fff7e6, #ffd9b3);  Light orange gradient background */
            text-align: center;
			
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            text-align: center;
        }
        .link {
		   color: #FF9900;
	   }

        header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(to right, #ffa033, #ff8c00); /* Orange gradient */
            border-bottom: 3px solid #e67e00;
        }
	   a:hover {
		   text-decoration: underline;
	   	}
	   a {
		   color: bisque;
			   text-decoration: none;
	   }
	   footer {
		   color: black;
	   }
	   footer:hover {
		   text-decoration: none;
	   }
	   
	 
	   h3 {
		   text-decoration: underline;
	   }
        header p {
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        main {
            padding: 40px 0;
            text-align: center;
        }
        
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }
            
			@media (max-width: 320px) {
        body {
            display: flex;
            flex-direction: column;
            align-items: center; 
        }
        
    }
    </style>
	
	</head>
	<body>
	<div class="container">
	<header>
	<p >Michaels JavaScript Homework page</p>
	</header>

	<div class="link">
<h3>Links</h3>
		</div>
	<div id="links">
	
		</div>

		<footer>
            <p></p>
        </footer>
	</div>
		</body>
</html>
